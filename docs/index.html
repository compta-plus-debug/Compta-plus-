<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compta+ — ERP Comptabilité</title>
    <meta name="theme-color" content="#14458F" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" href="icons/icon-192.png" />

    <!-- Tailwind CSS (CDN — génère les styles utilitaires utilisés par l'app, ex: flex, w-64, px-5) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React (CDN, aucune installation requise, version fixée) -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone : transforme le JSX directement dans le navigateur (version 7 fixée — la v8 récente casse le chargement classique) -->
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
    <!-- Supabase (CDN, version précise et stable, expose window.supabase.createClient) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js" crossorigin></script>
  </head>
  <body>
    <div id="root">
      <div id="boot-status" style="font-family: sans-serif; padding: 24px; color: #152238;">Chargement de Compta+…</div>
    </div>

    <!-- Filet de sécurité : affiche toute erreur directement sur la page, sans besoin des outils de développement -->
    <script>
      function showBootError(msg) {
        var el = document.getElementById("root");
        if (el) {
          el.innerHTML =
            '<div style="font-family: monospace; padding: 24px; color: #A6432F; background:#F7E9E3; white-space: pre-wrap; word-break: break-word;">' +
            '<b>Erreur au chargement de Compta+ :</b><br><br>' + String(msg) + '</div>';
        }
      }
      window.addEventListener("error", function (e) {
        showBootError((e && e.message) || e);
      });
      window.addEventListener("unhandledrejection", function (e) {
        showBootError((e && e.reason && (e.reason.message || e.reason)) || e);
      });
      setTimeout(function () {
        var el = document.getElementById("boot-status");
        if (el) {
          showBootError(
            "L'application n'a pas démarré après 6 secondes.\n\n" +
            "Cause probable : le fichier app.jsx est incomplet (upload tronqué) ou une des ressources (React, Babel, Supabase) n'a pas pu se charger.\n\n" +
            "Essayez d'ouvrir app.jsx directement dans le navigateur pour vérifier qu'il se termine bien par la ligne ReactDOM.createRoot(...)."
          );
        }
      }, 6000);
    </script>

    <!-- Filet de secours : si le script classique Supabase n'a pas fonctionné, on retente via ESM -->
    <script type="module">
      if (!(window.supabase && window.supabase.createClient)) {
        import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/+esm")
          .then((mod) => { window.supabase = { createClient: mod.createClient }; })
          .catch((e) => console.error("Repli Supabase ESM échoué :", e));
      }
    </script>

    <!-- L'application (JSX transformé à la volée par Babel Standalone) -->
    <script type="text/babel" data-presets="react" src="app.jsx"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
