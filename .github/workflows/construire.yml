# Construction et publication automatiques du site (Compta+).
# À chaque modification de src/, build/ ou tests/ sur main :
#   1. les tests automatiques sont découpés en 4 lots lancés en parallèle (chaque lot construit le site puis teste sa part) ;
#   2. si les 4 lots sont verts, le site est construit une dernière fois dans docs/ et publié dans le dépôt ;
#   3. GitHub Pages met docs/ en ligne.
# Aucun fichier compilé à déposer à la main.
name: Construire le site

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build/**"
      - "tests/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

# Une seule construction à la fois. On ne l'interrompt pas en cours de route, pour éviter une publication incomplète.
concurrency:
  group: construire-le-site
  cancel-in-progress: false

jobs:
  tests:
    name: Tests (lot ${{ matrix.lot }}/4)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lot: [1, 2, 3, 4]
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Choisir la cible (test ou production)
        id: cible
        run: |
          if [[ "${GITHUB_REPOSITORY}" == *"--test" ]]; then
            echo "cible=test" >> "$GITHUB_OUTPUT"
          else
            echo "cible=prod" >> "$GITHUB_OUTPUT"
          fi

      - name: Construire le site dans docs/
        env:
          TAILWIND_BIN: ${{ github.workspace }}/node_modules/.bin/tailwindcss
        run: node build/build.mjs "${{ steps.cible.outputs.cible }}"

      - name: Installer le navigateur de test
        run: npx playwright install --with-deps chromium

      - name: Tests automatiques (lot ${{ matrix.lot }}/4)
        env:
          SHARD: "${{ matrix.lot }}/4"
        run: node tests/tst-lancer.mjs

  publier:
    name: Publier le site
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Choisir la cible (test ou production)
        id: cible
        run: |
          if [[ "${GITHUB_REPOSITORY}" == *"--test" ]]; then
            echo "cible=test" >> "$GITHUB_OUTPUT"
          else
            echo "cible=prod" >> "$GITHUB_OUTPUT"
          fi

      - name: Construire le site dans docs/
        env:
          TAILWIND_BIN: ${{ github.workspace }}/node_modules/.bin/tailwindcss
        run: node build/build.mjs "${{ steps.cible.outputs.cible }}"

      - name: Garder une copie téléchargeable (secours)
        uses: actions/upload-artifact@v4
        with:
          name: site-compile
          path: docs/

      - name: Publier docs/ dans le dépôt
        run: |
          git config user.name "construction-automatique"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
            exit 0
          fi
          git commit -m "Construction automatique du site (${GITHUB_SHA:0:7})"
          for essai in 1 2 3 4; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "Publié."
              exit 0
            fi
            echo "Envoi refusé (essai $essai), nouvelle tentative…"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          echo "Impossible de publier après 4 essais."
          exit 1
