# Compile automatiquement le site à chaque modification de src/ : aucun fichier compilé à déposer à la main.
# La cible (test ou production) est déduite du NOM du dépôt : « compta-plus--test » = test, sinon production.
name: Construire le site

on:
  push:
    paths:
      - "src/**"
      - "build/**"
      - "*.jsx"
      - "package.json"
      - "build.mjs"
      - "controle.mjs"
      - "dependances.mjs"
      - "entetes.mjs"
      - "tst-*"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write

# Si plusieurs dépôts de fichiers se suivent, seule la dernière construction va au bout.
concurrency:
  group: construire-le-site
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer le compilateur
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Compiler
        run: |
          if [[ "${GITHUB_REPOSITORY}" == *"--test" ]]; then CIBLE=test; else CIBLE=prod; fi
          echo "Cible : $CIBLE"
          if [ -f build/build.mjs ]; then S=build/build.mjs; else S=build.mjs; fi
          echo "Script : $S"
          node "$S" "$CIBLE"

      - name: Installer le navigateur de test
        run: |
          if [ -f tests/tst-lancer.mjs ] || [ -f tst-lancer.mjs ]; then npx playwright install --with-deps chromium; else echo "Tests non installés : étape ignorée."; fi

      - name: Tests automatiques
        run: |
          if [ -f tests/tst-lancer.mjs ]; then node tests/tst-lancer.mjs
          elif [ -f tst-lancer.mjs ]; then node tst-lancer.mjs
          else echo "Tests non installés : étape ignorée."; fi

      - name: Garder une copie téléchargeable (secours)
        uses: actions/upload-artifact@v4
        with:
          name: site-compile
          path: |
            docs/app.min.js
            docs/index.html
            docs/vendor
            docs/fonts

      - name: Publier les fichiers compilés dans docs/
        run: |
          git config user.name "construction-automatique"
          git config user.email "actions@users.noreply.github.com"
          git add docs/app.min.js docs/index.html docs/vendor docs/fonts
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
          else
            git commit -m "Construction automatique du site"
            for essai in 1 2 3 4; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
              if git push; then echo "Publié."; exit 0; fi
              echo "Envoi refusé (essai $essai), nouvelle tentative…"; sleep 5
            done
            echo "Impossible de publier après 4 essais."; exit 1
          fi
